app = "before-series-6656"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  NODE_OPTIONS = "--max-old-space-size=160"
  PUBLIC_BASE_URL = "https://before.stoneup.xyz"
  X402_ENABLED = "true"
  X402_REQUIRE_PAYMENT = "true"
  X402_NETWORK = "eip155:196"
  X402_INIT_TIMEOUT_MS = "10000"
  X402_TIMEOUT_SECONDS = "300"
  OKX_BASE_URL = "https://web3.okx.com"
  OKX_SYNC_SETTLE = "true"
  REPORT_STORAGE_DIR = "/data/before-reports"
  REPORT_TTL_HOURS = "24"
  REPORT_MAX_ENTRIES = "2000"
  RATE_LIMIT_WINDOW_MS = "60000"
  RATE_LIMIT_MAX_REQUESTS = "120"
  RATE_LIMIT_MAX_ENTRIES = "10000"
  OKX_MARKET_TIMEOUT_MS = "5000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 75

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "8s"
    path = "/health"

[mounts]
  source = "before_reports"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 5

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
